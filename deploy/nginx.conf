# Atoms Demo · Nginx 反向代理（放到 /etc/nginx/conf.d/atoms-demo.conf）
#
# 关键点：生成过程用的是 SSE 流式推送，必须关掉代理缓冲，
# 否则界面上会"卡住不动"，直到整段生成完才一次性出现。

server {
    listen 80;
    server_name demo.example.com;          # 改成你的域名

    # ---------------------------------------------------------------
    # 可选但强烈建议：给整个站点加一层访问密码。
    # 因为模型 Key 是平台级共享的，公网裸奔意味着任何人都能刷你的额度。
    #   sudo htpasswd -c /etc/nginx/.htpasswd atoms
    # ---------------------------------------------------------------
    # auth_basic "Atoms Demo";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关闭缓冲与缓存，并把超时放宽（一次生成可能 60s+）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }
}

# HTTPS 用 certbot 一条命令即可：
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d demo.example.com
# 签发后 certbot 会自动改写上面的 server 块并加上跳转。
#
# 注意：登录态用的是 httpOnly Cookie，代码会在 X-Forwarded-Proto 为 https 时
# 自动给 Cookie 加 Secure 标记，所以上面的 proxy_set_header X-Forwarded-Proto
# 不能删，否则 HTTPS 下登录态不会带 Secure。
