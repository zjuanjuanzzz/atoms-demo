# Render 蓝图：免费实例没有持久磁盘，所以云端用 Upstash Redis REST 存数据。
# 本地开发仍然走 SQLite，一条命令就能跑。
services:
  - type: web
    name: atoms-demo
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node --disable-warning=ExperimentalWarning server.js
    envVars:
      - key: NODE_VERSION
        value: 24.9.0
      - key: STORAGE
        value: redis
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
